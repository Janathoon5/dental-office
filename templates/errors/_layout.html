<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} — Dental Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #1a3a5c; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .error-card { width: 100%; max-width: 420px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
<div class="card error-card p-4 text-center">
    <i class="bi bi-tooth" style="font-size: 2.5rem; color: #1a3a5c;"></i>
    <h4 class="mt-2 fw-bold text-dark">{% block heading %}{% endblock %}</h4>
    <p class="text-muted">{% block message %}{% endblock %}</p>
    <div class="d-grid gap-2 mt-2">
        <a href="/" class="btn" style="background:#1a3a5c; color:#fff;">Go to my home page</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Go back</a>
    </div>
</div>
</body>
</html>
