<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Dental Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #1a3a5c; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 380px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <div class="text-center mb-4">
        <i class="bi bi-tooth" style="font-size: 2.5rem; color: #1a3a5c;"></i>
        <h4 class="mt-2 fw-bold text-dark">Dental Office</h4>
        <p class="text-muted small">Sign in to continue</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2 small">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100" style="background:#1a3a5c; color:#fff;">Sign In</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
