<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication — Dental Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #1a3a5c; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 380px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
        .otp-input { font-size: 1.5rem; letter-spacing: 0.4rem; text-align: center; font-weight: 600; }
    </style>
</head>
<body>
<div class="card p-4">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock" style="font-size: 2.5rem; color: #1a3a5c;"></i>
        <h4 class="mt-2 fw-bold text-dark">Two-Factor Authentication</h4>
        <p class="text-muted small">Enter the 6-digit code from your authenticator app.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2 small text-center">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <input type="text" name="otp" class="form-control otp-input"
                   maxlength="6" inputmode="numeric" pattern="[0-9]*"
                   placeholder="000000" autofocus autocomplete="one-time-code" required>
        </div>
        <button type="submit" class="btn w-100 mb-3" style="background:#1a3a5c; color:#fff;">Verify</button>
        <div class="text-center">
            <a href="{% url 'login' %}" class="text-muted small">← Back to login</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
